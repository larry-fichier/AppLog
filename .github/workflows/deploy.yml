name: Deploy to Production

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest code
        run: |
          cd /var/www/Geslog
          git fetch origin main
          git reset --hard origin/main

      - name: Install dependencies
        run: |
          cd /var/www/Geslog
          npm install

      - name: Build frontend
        run: |
          cd /var/www/Geslog
          npm run build

      - name: Restart application
        run: |
          sudo pm2 restart geslog-helios --update-env
          sudo pm2 save
